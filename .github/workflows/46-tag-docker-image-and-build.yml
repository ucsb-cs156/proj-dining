name: "Tag Docker Image and Build Review App"
on:
  pull_request:

jobs:
  publish-docker-image:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    outputs:
      ghcr-url: ghcr.io/${{ steps.configure-vars.outputs.REPO }}:${{ steps.meta.outputs.version }}
      default-template-app: ${{ steps.configure-vars.outputs.TEMPLATE_APP }}
      default-dokku-url: ${{ steps.configure-vars.outputs.DOKKU_URL }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
      - name: Log in to the Container registry
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6.1.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=ref,event=pr
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure Review App Vars
        id: configure-vars
        if: ${{ vars.REVIEW_APPS_ENABLED == 'true' }}
        run: |
          echo "REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          MATCH_DOKKU="$(echo "$GITHUB_REPOSITORY" | grep -Po ".*\K\d{2}")"
          MATCH_TEMPLATE_APP="$(echo "$GITHUB_REPOSITORY" | grep -Po "(?<=proj-)\w+")"
          DOKKU_URL="$(echo "dokku-{1}.cs.ucsb.edu" | sed "s/{1}/${MATCH_DOKKU}/")"
          DOKKU_TEMPLATE_APP="$(echo "{1}-qa" | sed "s/{1}/${MATCH_TEMPLATE_APP}/")"
          echo "TEMPLATE_APP=${DOKKU_TEMPLATE_APP}" >> "$GITHUB_OUTPUT"
          echo "DOKKU_URL=${DOKKU_URL}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker images
        id: push
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ steps.configure-vars.outputs.REPO }}:buildcache

  deploy:
    if: ${{ vars.REVIEW_APPS_ENABLED == 'true' }}
    permissions:
      id-token: write
      actions: read
      contents: read
      pull-requests: read
      deployments: write
    needs: publish-docker-image
    concurrency: 
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    uses: ucsb-cs156/dokku-review-apps/.github/workflows/deploy-app.yml@main
    with:
      docker_image: ${{ needs.publish-docker-image.outputs.ghcr-url }}
      template_app_name: ${{ vars.TEMPLATE_APP_NAME || needs.publish-docker-image.outputs.default-template-app }}
      host_url: ${{ vars.HOST_URL || needs.publish-docker-image.outputs.default-dokku-url }}
    secrets:
      PORT: ${{ secrets.PORT || 22 }}
      SSH_USERNAME: ${{ secrets.SSH_USERNAME }}

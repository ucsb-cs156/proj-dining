server.port=${PORT:8080}
spring.profiles.active=@springProfiles@
spring.jpa.open-in-view=false

# For properties defined with 
#    var=${SYMBOL:${env.SYMBOL}}
# the SYMBOL value on the left of the : is the value from env,
# and will pick up values from Dokku Config Vars.
# The env.SYMBOL value on the right of the : is the value from a .env file
#   and is picked up as a result of this plugin in the pom.xml  
#     <groupId>me.paulschwarz</groupId>
#     <artifactId>spring-dotenv</artifactId>

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:${env.GOOGLE_CLIENT_ID:client_id_unset}}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:${env.GOOGLE_CLIENT_SECRET:client_secret_unset}}
spring.security.oauth2.client.registration.google.scope=email,profile

springdoc.swagger-ui.tryItOutEnabled=true
# see: https://medium.com/@thecodinganalyst/configure-spring-security-csrf-for-testing-on-swagger-e9e6461ee0c1
springdoc.swagger-ui.csrf.enabled=true
management.endpoints.web.exposure.include=mappings

app.admin.emails=${ADMIN_EMAILS:${env.ADMIN_EMAILS:phtcon@ucsb.edu}}
app.sourceRepo=${SOURCE_REPO:${env.SOURCE_REPO:https://github.com/ucsb-cs156/proj-dining}}
app.feedbackUrl=${APP_FEEDBACK_URL:${env.APP_FEEDBACK_URL:}}

spring.mvc.pathmatch.matching-strategy = ANT_PATH_MATCHER
server.compression.enabled=false

spring.mvc.format.date-time=iso

app.oauth.login=${OAUTH_LOGIN:${env.OAUTH_LOGIN:/oauth2/authorization/google}}

app.ucsb.api.consumer_key=${UCSB_API_KEY:${env.UCSB_API_KEY:see-instructions-in-readme}}
app.ucsb.api.host=${UCSB_DINING_API_HOST:${env.UCSB_DINING_API_HOST:https://api.ucsb.edu}}

# Identifies this app instance to any UCSB API proxy sitting in front of app.ucsb.api.host
# (e.g. dining-caching-proxy), so per-caller traffic can be tracked by name instead of by
# IP address, which is unreliable when both apps are Docker containers on the same Dokku host.
app.name=${APP_NAME:app-name-unset}
app.hostname=${APP_HOSTNAME:app-hostname-unset}

spring.jpa.hibernate.ddl-auto=none
spring.liquibase.change-log=db/migration/changelog-master.json